# Напоминания для телефонной версии.
#
# Всё приложение офлайновое, и это единственный сетевой кусок: браузер не умеет
# будить сам себя, поэтому в нужный час уведомление должен прислать кто-то извне.
# Воркер бесплатный, хранит только подписки браузеров и ничего об учёбе не знает.
name = "english-coach-reminders"
main = "worker.js"
compatibility_date = "2026-01-01"

# Раз в час: сам воркер решает, кому именно сейчас пора, по местному часу подписки.
[triggers]
crons = ["0 * * * *"]

# Ничего из этого не секрет: публичный ключ и так уходит в браузер, адреса публичны.
# Секретом остаётся ровно один VAPID_PRIVATE_KEY — он кладётся отдельной командой и
# в репозиторий не попадает.
[vars]
ALLOWED_ORIGINS = "https://x8bvgp4hv8-beep.github.io"
APP_URL = "https://x8bvgp4hv8-beep.github.io/english-coach/"
VAPID_SUBJECT = "mailto:macjlo.samarin@gmail.com"
VAPID_PUBLIC_KEY = "BDSGV7GzYFi8Rxvkg0Zzzt4PNPt1HWn9sBn_wOCLQ_nUXeFXpzP0BHAcEY9BJyj0OW7zW9UwW7NOJ1t9nCaG0z0"

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "ЗАПОЛНИТСЯ_КОМАНДОЙ_ИЗ_README"
