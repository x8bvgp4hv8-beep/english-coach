# Напоминания для телефонной версии.
#
# Всё приложение офлайновое, и это единственный сетевой кусок: браузер не умеет
# будить сам себя, поэтому в нужный час уведомление должен прислать кто-то извне.
# Воркер бесплатный, хранит только подписки браузеров и ничего об учёбе не знает.
name = "english-coach-reminders"
main = "worker.js"
compatibility_date = "2026-01-01"

# Раз в час: сам воркер решает, кому именно сейчас пора, по местному часу подписки.
[triggers]
crons = ["0 * * * *"]

[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "ЗАПОЛНИТСЯ_КОМАНДОЙ_ИЗ_README"
