<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Котелок — английский. Система координат маскота (rhino 400×400): вставляется
       как есть последним элементом внутрь <g class="head">. -->
  <defs><clipPath id="uk-crown"><path d="M156 86 C156 28 244 28 244 86 Z"/></clipPath></defs>
  <g class="hat hat-uk">
    <g transform="rotate(-6 200 90) translate(0 6)">
      <ellipse cx="200" cy="98" rx="62" ry="11" fill="#1B2028" opacity=".16"/>
      <path d="M156 86 C156 28 244 28 244 86 Z" fill="#2E3542"/>
      <g clip-path="url(#uk-crown)">
        <rect x="150" y="66" width="104" height="15" fill="#C8102E"/>
        <ellipse cx="180" cy="50" rx="15" ry="19" fill="#fff" opacity=".13" transform="rotate(-18 180 50)"/>
      </g>
      <ellipse cx="200" cy="86" rx="74" ry="13" fill="#2E3542"/>
      <ellipse cx="200" cy="90" rx="74" ry="10" fill="#232936"/>
      <ellipse cx="200" cy="84" rx="74" ry="12" fill="#2E3542"/>
    </g>
  </g>
</svg>
