# Builds the phone client and publishes it to GitHub Pages.
#
# The web client needs HTTPS to be worth anything on a phone: without it Safari
# refuses the offline cache, the "add to Home Screen" install and the microphone.
name: Deploy web client

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'native/Sources/EnglishCoachCore/Resources/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run replaces an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The courses are copied from the macOS resources by the build itself, so a
      # content change ships to the phone without being duplicated in the repo.
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # Pages regularly leaves a deployment in `deployment_queued` past the action's
      # ten-minute cap — a longer `timeout` is clamped back down with a warning, so the
      # only cure is another attempt. Three builds in a row failed that way with nothing
      # wrong in them, and re-running by hand always worked. This is that re-run.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
